<!DOCTYPE html>
<html>
<head>
    <title>Student CRUD System</title>
</head>

<body>

<h2>Student CRUD System</h2>

Student ID:
<input type="text" id="studentId">

<br>

Student Name:
<input type="text" id="studentName">

<br>

Course:
<input type="text" id="studentCourse">

<input type="hidden" id="editIndex" value="-1">

<br>

<button onclick="saveStudent()">Save Student</button>
<button onclick="clearForm()">Clear</button>

<br>
<br>

Search Student:
<input type="text" id="searchStudent">

<button onclick="searchStudent()">Search</button>
<button onclick="displayStudents()">Show All</button>
<button onclick="sortStudents()">Sort by Name</button>

<br>
<br>

<table border="1">
    <thead>
        <tr>
            <th>No.</th>
            <th>Student ID</th>
            <th>Student Name</th>
            <th>Course</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="studentTable">
    </tbody>
</table>

<p id="studentCount">Total Students: 0</p>


<script>

let students = [];


// CREATE and UPDATE
function saveStudent() {

    let id = document.getElementById("studentId").value;
    let name = document.getElementById("studentName").value;
    let course = document.getElementById("studentCourse").value;
    let editIndex = parseInt(document.getElementById("editIndex").value);

    if (id == "" || name == "" || course == "") {
        alert("Please complete all fields.");
        return;
    }

    // Check for duplicate Student ID
    for (let index = 0; index < students.length; index++) {

        if (students[index].id == id && index != editIndex) {
            alert("Student ID already exists.");
            return;
        }
    }

    // Check for duplicate Student Name
    for (let index = 0; index < students.length; index++) {

        if (
            students[index].name.toLowerCase() == name.toLowerCase()
            && index != editIndex
        ) {
            alert("Student name already exists.");
            return;
        }
    }

    if (editIndex == -1) {

        // CREATE
        let newStudent = {
            id: id,
            name: name,
            course: course
        };

        // Add data without using push()
        students[students.length] = newStudent;

        alert("Student added successfully.");

    } else {

        // UPDATE
        students[editIndex].id = id;
        students[editIndex].name = name;
        students[editIndex].course = course;

        alert("Student updated successfully.");
    }

    clearForm();
    displayStudents();
}


// READ
function displayStudents() {

    let table = document.getElementById("studentTable");

    table.innerHTML = "";

    if (students.length == 0) {

        table.innerHTML =
            "<tr>" +
            "<td colspan='5'>No student records found.</td>" +
            "</tr>";

        document.getElementById("studentCount").innerHTML =
            "Total Students: 0";

        return;
    }

    for (let index = 0; index < students.length; index++) {

        table.innerHTML +=
            "<tr>" +
            "<td>" + (index + 1) + "</td>" +
            "<td>" + students[index].id + "</td>" +
            "<td>" + students[index].name + "</td>" +
            "<td>" + students[index].course + "</td>" +
            "<td>" +
            "<button onclick='editStudent(" + index + ")'>Edit</button>" +
            "<button onclick='deleteStudent(" + index + ")'>Delete</button>" +
            "</td>" +
            "</tr>";
    }

    // Display total number of students
    document.getElementById("studentCount").innerHTML =
        "Total Students: " + students.length;
}


// Select a student for editing
function editStudent(index) {

    document.getElementById("studentId").value =
        students[index].id;

    document.getElementById("studentName").value =
        students[index].name;

    document.getElementById("studentCourse").value =
        students[index].course;

    document.getElementById("editIndex").value = index;
}


// DELETE
function deleteStudent(index) {

    let answer =
        confirm("Are you sure you want to delete this student?");

    if (answer == false) {
        return;
    }

    /*
    Move every item after the selected index
    one position to the left.
    */

    for (
        let position = index;
        position < students.length - 1;
        position++
    ) {

        students[position] =
            students[position + 1];
    }

    // Reduce the array length to remove the last duplicate item
    students.length = students.length - 1;

    clearForm();
    displayStudents();

    alert("Student deleted successfully.");
}


// Clear the input fields
function clearForm() {

    document.getElementById("studentId").value = "";

    document.getElementById("studentName").value = "";

    document.getElementById("studentCourse").value = "";

    document.getElementById("editIndex").value = "-1";
}


// SEARCH STUDENT
function searchStudent() {

    let search =
        document.getElementById("searchStudent").value.toLowerCase();

    let table =
        document.getElementById("studentTable");

    table.innerHTML = "";

    let found = false;

    for (let index = 0; index < students.length; index++) {

        let studentName =
            students[index].name.toLowerCase();

        let match = false;

        /*
        Search manually without using
        includes(), indexOf(), find(), or filter().
        */

        for (
            let position = 0;
            position <= studentName.length - search.length;
            position++
        ) {

            let part = "";

            for (
                let letter = 0;
                letter < search.length;
                letter++
            ) {

                part +=
                    studentName[position + letter];
            }

            if (part == search) {

                match = true;
                break;
            }
        }

        if (match == true) {

            found = true;

            table.innerHTML +=
                "<tr>" +
                "<td>" + (index + 1) + "</td>" +
                "<td>" + students[index].id + "</td>" +
                "<td>" + students[index].name + "</td>" +
                "<td>" + students[index].course + "</td>" +
                "<td>" +
                "<button onclick='editStudent(" + index + ")'>Edit</button>" +
                "<button onclick='deleteStudent(" + index + ")'>Delete</button>" +
                "</td>" +
                "</tr>";
        }
    }

    if (found == false) {

        table.innerHTML =
            "<tr>" +
            "<td colspan='5'>No student found.</td>" +
            "</tr>";
    }
}


// SORT BY NAME
function sortStudents() {

    /*
    Bubble Sort
    No sort() function is used.
    */

    for (
        let first = 0;
        first < students.length - 1;
        first++
    ) {

        for (
            let second = 0;
            second < students.length - first - 1;
            second++
        ) {

            if (
                students[second].name.toLowerCase() >
                students[second + 1].name.toLowerCase()
            ) {

                let temporary =
                    students[second];

                students[second] =
                    students[second + 1];

                students[second + 1] =
                    temporary;
            }
        }
    }

    displayStudents();
}


// Initially display the empty table
displayStudents();

</script>

</body>
</html>
